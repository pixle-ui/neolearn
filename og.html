<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OG Image Maker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; }
    .card {
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #05030d 0%, #1a0b2e 60%, #05030d 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 6vh 6vw;
      position: relative;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      text-align: center;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,47,185,0.3), transparent 50%),
        radial-gradient(circle at 80% 85%, rgba(0,240,255,0.25), transparent 50%);
      pointer-events: none;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4vh;
      position: relative;
      z-index: 1;
    }
    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff2fb9, #00f0ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      color: #05030d;
      box-shadow: 0 0 25px rgba(255,47,185,0.6);
    }
    .brand-name {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
    }
    h1 {
      font-size: 7vh;
      line-height: 1.1;
      color: #fff;
      font-weight: 900;
      letter-spacing: -1px;
      position: relative;
      z-index: 1;
    }
    h1 .grad {
      background: linear-gradient(135deg, #ff2fb9, #00f0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sub {
      margin-top: 3vh;
      font-size: 2.4vh;
      color: #a49dc0;
      line-height: 1.5;
      position: relative;
      z-index: 1;
    }
    .tags {
      display: flex;
      gap: 8px;
      margin-top: 4vh;
      flex-wrap: wrap;
      justify-content: center;
      position: relative;
      z-index: 1;
    }
    .tag {
      font-family: monospace;
      font-size: 1.7vh;
      padding: 5px 12px;
      background: rgba(255,47,185,0.15);
      border: 1px solid rgba(255,47,185,0.4);
      border-radius: 50px;
      color: #ff2fb9;
      font-weight: 700;
    }
    .url {
      margin-top: 4vh;
      font-family: monospace;
      font-size: 1.9vh;
      color: #00f0ff;
      letter-spacing: 1px;
      font-weight: 700;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-icon">⌬</div>
      <div class="brand-name">NeoLearn</div>
    </div>
    <h1>Learn <span class="grad">cool tech.</span><br>Step by step.</h1>
    <div class="sub">Free tutorials for every device.<br>No signup. No ads. No tracking.</div>
    <div class="tags">
      <span class="tag">AI</span>
      <span class="tag">TERMUX</span>
      <span class="tag">LINUX</span>
      <span class="tag">SECURITY</span>
    </div>
    <div class="url">▸ neolearn-a09.pages.dev</div>
  </div>
</body>
</html>
